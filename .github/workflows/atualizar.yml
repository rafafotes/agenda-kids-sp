name: Publicar site

# A coleta roda no computador do mantenedor (scripts/coletar.sh, às 6h e 18h), porque alguns sites
# recusam acessos vindos de servidores de nuvem. Cada coleta faz push dos dados; aqui só testamos e
# publicamos o site no GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar-site
  cancel-in-progress: true

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes
        run: python -m unittest -v

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: testar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
