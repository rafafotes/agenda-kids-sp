name: Atualizar agenda

on:
  schedule:
    - cron: "0 9,21 * * *" # 6h e 18h em São Paulo
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-agenda
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AGENDA_MODELO: ${{ vars.AGENDA_MODELO || 'claude-opus-5-5' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes
        run: python -m unittest -v

      - name: Instalar SDK da Anthropic (só se houver chave)
        if: env.ANTHROPIC_API_KEY != ''
        run: pip install -r requirements-agente.txt

      - name: Coletar eventos
        if: github.event_name != 'push'
        run: python -m crawler

      - name: Salvar dados no repositório
        if: github.event_name != 'push'
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add site/dados/eventos.json crawler/cache_agente.json
          git diff --cached --quiet || git commit -m "Atualiza agenda ($(TZ=America/Sao_Paulo date '+%d/%m %H:%M'))"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
